name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    # Debian bookworm (glibc 2.36) matches the CPA container base image.
    container: golang:1.26-bookworm
    strategy:
      matrix:
        include:
          - goarch: amd64
            cc: gcc
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        if: matrix.goarch == 'arm64'
        run: apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          version="0.0.0-dev+${GITHUB_SHA::12}"
          case "$GITHUB_REF" in refs/tags/v*) version="${GITHUB_REF#refs/tags/v}";; esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go build -trimpath -buildmode=c-shared -ldflags "-s -w -X main.version=$version" \
            -o dist/linux/${{ matrix.goarch }}/cliproxy-costs.so .
          rm -f dist/linux/${{ matrix.goarch }}/cliproxy-costs.h
      - name: Check artifact
        run: |
          apt-get update && apt-get install -y --no-install-recommends file binutils
          file dist/linux/${{ matrix.goarch }}/cliproxy-costs.so
          file dist/linux/${{ matrix.goarch }}/cliproxy-costs.so | grep -q "$([ ${{ matrix.goarch }} = arm64 ] && echo aarch64 || echo x86-64)"
          nm -D dist/linux/${{ matrix.goarch }}/cliproxy-costs.so | grep -q ' T cliproxy_plugin_init$'
      - uses: actions/upload-artifact@v4
        with:
          name: cliproxy-costs-linux-${{ matrix.goarch }}
          path: dist/linux/${{ matrix.goarch }}/cliproxy-costs.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir release
          for arch in amd64 arm64; do
            cp artifacts/cliproxy-costs-linux-$arch/cliproxy-costs.so release/cliproxy-costs-linux-$arch.so
          done
          (cd release && sha256sum *.so > SHA256SUMS)
          # The .so embeds CLIProxyAPI-derived code and uPlot: ship their notices.
          cp LICENSE THIRD_PARTY_NOTICES.md release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
